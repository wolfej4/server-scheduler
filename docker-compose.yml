services:
  server-schedule:
    build: .
    image: server-schedule:latest
    container_name: server-schedule
    restart: unless-stopped
    ports:
      - "8085:8080"
    volumes:
      - ./data:/data
    environment:
      - TZ=America/Chicago
      # Owner of the data folder. Unraid appdata convention is 99/100.
      - PUID=1000
      - PGID=1000
